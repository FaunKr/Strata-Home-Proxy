name: CI
on:
  # Branches get CI through their pull request; pushes only run on main, where
  # the image is published. Without this filter every commit on a PR branch was
  # built twice (push and pull_request).
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # No paths-ignore here: a docs-only pull request still needs ci-ok, so the
  # changes job runs and skips everything else.
  pull_request:
  workflow_dispatch:
# A new push to a PR cancels the run for the commit before it; runs on main are
# never cancelled (only their publish jobs are, see there).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  changes:
    # Decides which of the jobs below a pull request needs (scripts/ci-select.sh).
    # Pushes to main and manual runs select everything; on main the test job
    # then only refreshes the Rust cache. A push to main publishes each image
    # whose files changed since its last publish (scripts/ci-publish.sh); a
    # manual run on main publishes both.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # Reads the revision label of the published images.
      packages: read
    outputs:
      test: ${{ steps.select.outputs.test }}
      packages: ${{ steps.select.outputs.packages }}
      cargo: ${{ steps.select.outputs.cargo }}
      image: ${{ steps.select.outputs.image }}
      bench: ${{ steps.select.outputs.bench }}
      ui: ${{ steps.select.outputs.ui }}
      publish: ${{ steps.select.outputs.publish }}
      publish-bench: ${{ steps.select.outputs.publish-bench }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a push, the diff since the published commits needs the history.
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The repo is English (GLOSSARY.md). Checked here and not in test, so a
      # docs-only pull request is checked too; it takes seconds.
      - run: scripts/check-language.sh
      # No Claude session links in the PR's commits; its body is checked by
      # pr-text.yml, so fixing the body needs no new CI run.
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/pr-text.sh commits
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -z $PR ]]; then
            if [[ $EVENT == push ]]; then
              scripts/ci-select.sh --all | grep -v '^publish' | tee -a "$GITHUB_OUTPUT"
              scripts/ci-publish.sh | tee -a "$GITHUB_OUTPUT"
            else
              scripts/ci-select.sh --all | tee -a "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # Renamed files count with their old path too.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          # The API lists at most 3000 files; beyond that, run everything.
          count=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .changed_files)
          if ((count >= 3000)); then
            scripts/ci-select.sh --all
          else
            scripts/ci-select.sh <<<"$files"
          fi | tee -a "$GITHUB_OUTPUT"
  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.cargo == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # check.sh lints the PC service's Windows code for this target, in
          # place of a Windows runner (those minutes count double); the real
          # Windows check is the manual workflow windows.yml.
          targets: wasm32-unknown-unknown, x86_64-pc-windows-gnu
      # Only main saves the cache, pull requests read it: one set per branch
      # overflowed the Actions cache. On main the pull request ran the checks
      # already, so there this job only looks the cache up (it holds the
      # dependencies, keyed on Cargo.lock, the manifests and the rustc version)
      # and runs check.sh only to refill it, e.g. after a dependency change or
      # a new stable Rust.
      # A pull request that builds no crate (cargo=false) needs no cache.
      - id: cache
        if: needs.changes.outputs.cargo == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          lookup-only: ${{ github.event_name == 'push' }}
      - if: github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true'
        run: npm install -g eslint@10.1.0
      # check.sh runs the tests with it, at the version .config/nextest.toml pins.
      - id: nextest
        if: needs.changes.outputs.cargo == 'true' && (github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true')
        run: echo "version=$(scripts/nextest-version.sh)" >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.cargo == 'true' && (github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ steps.nextest.outputs.version }}
      # check.sh lints the workflows with it.
      - if: github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true'
        run: scripts/install-actionlint.sh "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # check.sh lints the PowerShell port of local-agent with it (pwsh is on
      # the runner).
      - if: github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true'
        run: scripts/install-psscriptanalyzer.sh
      - if: github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true'
        run: |
          if [[ $CARGO == false ]]; then
            scripts/check.sh --no-cargo
          else
            # Unquoted on purpose: one argument per package, none for everything.
            # shellcheck disable=SC2086
            scripts/check.sh $PACKAGES
          fi
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
          CARGO: ${{ needs.changes.outputs.cargo }}
      # The code-bench tests that need root (the agent user, the firewall in
      # its own network namespace); check.sh runs them as the runner's user,
      # where they are skipped.
      - name: Code-bench tests as root
        if: github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true'
        run: sudo python3 -I tools/code-bench/test_runner.py
      # How close the job is to the runner's disk limit, before the linker
      # dies of it again.
      - name: Free disk space left
        if: always()
        run: df -h /
  ui:
    # The web UI in a real browser (scripts/ui-check.sh): only there does a
    # page that fails to hydrate show up. Pull requests only, like the checks.
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Reads the dependencies main's test job cached; saves nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - run: scripts/install-cargo-leptos.sh
      # The browsers of exactly that version, through its own command; the
      # version of the cloud sessions.
      - run: npm install -g playwright@1.56.1 && "$(npm root -g)/playwright/cli.js" install --with-deps chromium
      - run: SHOTS=1 scripts/ui-check.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check
          path: target/ui-check/
  image:
    # Builds the images whose build definition a pull request changes: the NAS
    # image and the code benchmark's runner (tools/code-bench). Dependencies sit
    # in their own layers (cargo-chef). This job only reads the layer cache;
    # writing it from every branch overflowed the Actions cache and evicted
    # main's layers. On main the publish jobs build them instead.
    needs: changes
    if: github.event_name != 'push' && (needs.changes.outputs.image == 'true' || needs.changes.outputs.bench == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: needs.changes.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: STRATA_BUILD_ID=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
      - if: needs.changes.outputs.bench == 'true'
        uses: docker/build-push-action@v6
        with:
          context: tools/code-bench
          platforms: linux/amd64
          cache-from: type=gha,scope=code-bench
  publish:
    # Builds the proxy's image on main, publishes it (the NAS pulls
    # ghcr.io/faunkr/strata-home-proxy:latest) and writes the layer cache that
    # pull requests read. The pull request ran the tests. Runs when the files
    # that go into the image changed since its last publish, or on a manual run.
    needs: changes
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # One publish at a time, and a newer push cancels the one still running: its
    # image would be out of date the moment it lands. :latest moves only once an
    # image is pushed in full, so a cancel never leaves it half done, and the
    # next push catches up on what a cancelled one would have published. One at
    # a time also keeps an older commit that finishes last from setting :latest
    # back (run #147 hung for 40 min while a newer one published). A build
    # normally takes about 6 minutes.
    concurrency:
      group: publish
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/faunkr/strata-home-proxy:latest
            ghcr.io/faunkr/strata-home-proxy:${{ github.sha }}
          # The NAS update script logs it (deploy/truenas-auto-update.sh), and
          # scripts/ci-publish.sh diffs against it.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: STRATA_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  publish-bench:
    # The code benchmark runner's image, the same way as publish but on its own:
    # neither job waits for or cancels the other.
    needs: changes
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && needs.changes.outputs.publish-bench == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-bench
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools/code-bench
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/faunkr/strata-code-bench:latest
            ghcr.io/faunkr/strata-code-bench:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=code-bench
          cache-to: type=gha,mode=max,scope=code-bench
  ci-ok:
    # The one check that sums up a run, for branch protection: jobs a pull
    # request doesn't need are skipped, and skipped counts as passed. A run
    # cancelled by a newer push skips it too; the newer run reports.
    if: ${{ !cancelled() }}
    needs: [changes, test, image, ui]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
