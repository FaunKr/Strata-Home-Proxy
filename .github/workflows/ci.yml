name: CI
on:
  # Branches get CI through their pull request; pushes only run on main, where
  # the image is published. Without this filter every commit on a PR branch was
  # built twice (push and pull_request).
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # No paths-ignore here: a docs-only pull request still needs ci-ok, so the
  # changes job runs and skips everything else.
  pull_request:
  workflow_dispatch:
# A new push to a PR cancels the run for the commit before it; runs on main are
# never cancelled, so every commit there gets its image.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  changes:
    # Decides which of the jobs below a pull request needs (scripts/ci-select.sh).
    # Pushes to main and manual runs need everything.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test: ${{ steps.select.outputs.test }}
      packages: ${{ steps.select.outputs.packages }}
      image: ${{ steps.select.outputs.image }}
      bench: ${{ steps.select.outputs.bench }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z $PR ]]; then
            scripts/ci-select.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # Renamed files count with their old path too.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          # The API lists at most 3000 files; beyond that, run everything.
          count=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .changed_files)
          if ((count >= 3000)); then
            scripts/ci-select.sh --all
          else
            scripts/ci-select.sh <<<"$files"
          fi | tee -a "$GITHUB_OUTPUT"
  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      # The test binaries of all packages no longer fit the runner's disk
      # (the linker died with a bus error at 29 MB free); these preinstalled
      # SDKs are not needed here.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # check.sh lints the PC service's Windows code for this target, in
          # place of a Windows runner (those minutes count double); the real
          # Windows check is the manual workflow windows.yml.
          targets: wasm32-unknown-unknown, x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # Unquoted on purpose: one argument per package, none for everything.
      - run: scripts/check.sh $PACKAGES
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
  image:
    # Builds the images whose build definition a pull request changes: the NAS
    # image and the code benchmark's runner (tools/code-bench). Dependencies sit
    # in their own layers (cargo-chef). Pull requests only read the layer cache;
    # writing it from every branch overflowed the Actions cache and evicted
    # main's layers.
    needs: changes
    if: needs.changes.outputs.image == 'true' || needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: needs.changes.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: STRATA_BUILD_ID=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
      - if: needs.changes.outputs.bench == 'true'
        uses: docker/build-push-action@v6
        with:
          context: tools/code-bench
          platforms: linux/amd64
          cache-from: type=gha,scope=code-bench
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=code-bench' || '' }}
  publish:
    # On pushes to the default branch, once tests pass, publishes the image to
    # ghcr.io/faunkr/strata-home-proxy:latest so the NAS can pull it. Every layer
    # comes from the cache the image job just wrote, so this only uploads.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/faunkr/strata-home-proxy:latest
            ghcr.io/faunkr/strata-home-proxy:${{ github.sha }}
          # The NAS update script logs it (deploy/truenas-auto-update.sh).
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # The same as in the image job, so every layer comes from its cache.
          build-args: STRATA_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
      - uses: docker/build-push-action@v6
        with:
          context: tools/code-bench
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/faunkr/strata-code-bench:latest
            ghcr.io/faunkr/strata-code-bench:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=code-bench
  ci-ok:
    # The one check that sums up a run, for branch protection: jobs a pull
    # request doesn't need are skipped, and skipped counts as passed.
    if: always()
    needs: [changes, test, image]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
