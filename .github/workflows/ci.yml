name: CI
on:
  # Branches get CI through their pull request; pushes only run on main, where
  # the image is published. Without this filter every commit on a PR branch was
  # built twice (push and pull_request).
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # No paths-ignore here: a docs-only pull request still needs ci-ok, so the
  # changes job runs and skips everything else.
  pull_request:
  workflow_dispatch:
# A new push to a PR cancels the run for the commit before it; runs on main are
# never cancelled, so every commit there gets its image.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  changes:
    # Decides which of the jobs below a pull request needs: the crates it
    # touches plus the crates that depend on them (the NAS proxy links the web
    # UI). Shared files, pushes to main and manual runs need everything.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      test: ${{ steps.select.outputs.test }}
      packages: ${{ steps.select.outputs.packages }}
      windows: ${{ steps.select.outputs.windows }}
      image: ${{ steps.select.outputs.image }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain*
              - .github/workflows/**
              - scripts/check.sh
            admin-ui:
              - crates/admin-ui/**
            nas-proxy:
              - crates/nas-proxy/**
              # Embedded and served by the proxy (include_str!).
              - deploy/windows/**
            pc-agent:
              - crates/pc-agent/**
            windows:
              - *shared
              - crates/pc-agent/**
              - deploy/windows/**
            image:
              - *shared
              - crates/**
              - deploy/windows/**
              - Dockerfile
              - .dockerignore
      - id: select
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          SHARED: ${{ steps.filter.outputs.shared }}
          ADMIN_UI: ${{ steps.filter.outputs.admin-ui }}
          NAS_PROXY: ${{ steps.filter.outputs.nas-proxy }}
          PC_AGENT: ${{ steps.filter.outputs.pc-agent }}
          WINDOWS: ${{ steps.filter.outputs.windows }}
          IMAGE: ${{ steps.filter.outputs.image }}
        run: |
          # An empty package list means the whole workspace (scripts/check.sh).
          if [[ $PULL_REQUEST != true || $SHARED == true ]]; then
            printf '%s\n' test=true packages= windows=true image=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          packages=()
          [[ $ADMIN_UI == true ]] && packages+=(strata-admin-ui strata-nas-proxy)
          [[ $NAS_PROXY == true ]] && packages+=(strata-nas-proxy)
          [[ $PC_AGENT == true ]] && packages+=(strata-pc-agent)
          packages=$(printf '%s\n' "${packages[@]}" | sort -u | xargs)
          {
            echo "test=$([[ -n $packages ]] && echo true || echo false)"
            echo "packages=$packages"
            echo "windows=$WINDOWS"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Unquoted on purpose: one argument per package, none for everything.
      - run: scripts/check.sh $PACKAGES
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
  windows:
    # Builds the PC service and offers it as a download (strata-pc-agent-windows).
    # Runs alongside test: it lints and tests the agent on its own.
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p strata-pc-agent --all-targets -- -D warnings
      - run: cargo test -p strata-pc-agent
      - run: cargo build --release -p strata-pc-agent
        env:
          # Part of the version the service reports (crates/pc-agent/build.rs).
          STRATA_BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: install.ps1 parses
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\deploy\windows\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
        shell: powershell
      - run: |
          mkdir dist
          copy target\release\strata-pc-agent.exe dist\
          copy crates\pc-agent\strata-pc-agent.example.toml dist\
          copy deploy\windows\install.ps1 dist\
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: strata-pc-agent-windows
          path: dist/
  image:
    # Builds the NAS image alongside test and fills the layer cache. Dependencies
    # sit in their own layers (cargo-chef), so a code change only rebuilds our crates.
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: STRATA_BUILD_ID=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  publish:
    # On pushes to the default branch, once tests pass, publishes the image to
    # ghcr.io/faunkr/strata-home-proxy:latest so the NAS can pull it. Every layer
    # comes from the cache the image job just wrote, so this only uploads.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/faunkr/strata-home-proxy:latest
            ghcr.io/faunkr/strata-home-proxy:${{ github.sha }}
          # The NAS update script logs it (deploy/truenas-auto-update.sh).
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # The same as in the image job, so every layer comes from its cache.
          build-args: STRATA_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
  ci-ok:
    # The one check that sums up a run, for branch protection: jobs a pull
    # request doesn't need are skipped, and skipped counts as passed.
    if: always()
    needs: [changes, test, windows, image]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
