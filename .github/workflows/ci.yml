name: CI
on:
  # Branches get CI through their pull request; pushes only run on main, where
  # the image is published. Without this filter every commit on a PR branch was
  # built twice (push and pull_request).
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # No paths-ignore here: a docs-only pull request still needs ci-ok, so the
  # changes job runs and skips everything else.
  pull_request:
  workflow_dispatch:
# A new push to a PR cancels the run for the commit before it; runs on main are
# never cancelled, so every commit there gets its image.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  changes:
    # Decides which of the jobs below a pull request needs (scripts/ci-select.sh).
    # Pushes to main and manual runs need everything.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test: ${{ steps.select.outputs.test }}
      packages: ${{ steps.select.outputs.packages }}
      windows: ${{ steps.select.outputs.windows }}
      image: ${{ steps.select.outputs.image }}
      ui: ${{ steps.select.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z $PR ]]; then
            scripts/ci-select.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # Renamed files count with their old path too.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          # The API lists at most 3000 files; beyond that, run everything.
          count=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .changed_files)
          if ((count >= 3000)); then
            scripts/ci-select.sh --all
          else
            scripts/ci-select.sh <<<"$files"
          fi | tee -a "$GITHUB_OUTPUT"
  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      # The test binaries of all packages no longer fit the runner's disk
      # (the linker died with a bus error at 29 MB free); these preinstalled
      # SDKs are not needed here.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Unquoted on purpose: one argument per package, none for everything.
      - run: scripts/check.sh $PACKAGES
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
      # The code-bench tests that need root (the agent user, the firewall in
      # its own network namespace); check.sh runs them as the runner's user,
      # where they are skipped.
      - name: Code-bench tests as root
        run: sudo python3 -I tools/code-bench/test_runner.py
      # How close the job is to the runner's disk limit, before the linker
      # dies of it again.
      - name: Free disk space left
        if: always()
        run: df -h /
  ui:
    # The web UI in a real browser (scripts/ui-check.sh): only there does a
    # page that fails to hydrate show up.
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: scripts/install-cargo-leptos.sh
      # The Playwright version of the cloud sessions.
      # The browsers of exactly that version, through its own command.
      - run: npm install -g playwright@1.56.1 && "$(npm root -g)/playwright/cli.js" install --with-deps chromium
      - run: SHOTS=1 scripts/ui-check.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check
          path: target/ui-check/
  windows:
    # Builds the PC service and offers it as a download (strata-pc-agent-windows).
    # Runs alongside test: it lints and tests the agent on its own.
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p strata-pc-agent --all-targets -- -D warnings
      - run: cargo test -p strata-pc-agent
      - run: cargo build --release -p strata-pc-agent
        env:
          # Part of the version the service reports (crates/pc-agent/build.rs).
          STRATA_BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: install.ps1 parses
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\deploy\windows\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
        shell: powershell
      - run: |
          mkdir dist
          copy target\release\strata-pc-agent.exe dist\
          copy crates\pc-agent\strata-pc-agent.example.toml dist\
          copy deploy\windows\install.ps1 dist\
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: strata-pc-agent-windows
          path: dist/
  image:
    # Builds the NAS image alongside test and fills the layer cache. Dependencies
    # sit in their own layers (cargo-chef), so a code change only rebuilds our crates.
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: STRATA_BUILD_ID=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The code benchmark's runner (tools/code-bench), its own image.
      - uses: docker/build-push-action@v6
        with:
          context: tools/code-bench
          platforms: linux/amd64
          cache-from: type=gha,scope=code-bench
          cache-to: type=gha,mode=max,scope=code-bench
  publish:
    # On pushes to the default branch, once tests pass, publishes the image to
    # ghcr.io/faunkr/strata-home-proxy:latest so the NAS can pull it. Every layer
    # comes from the cache the image job just wrote, so this only uploads.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/faunkr/strata-home-proxy:latest
            ghcr.io/faunkr/strata-home-proxy:${{ github.sha }}
          # The NAS update script logs it (deploy/truenas-auto-update.sh).
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # The same as in the image job, so every layer comes from its cache.
          build-args: STRATA_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
      - uses: docker/build-push-action@v6
        with:
          context: tools/code-bench
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/faunkr/strata-code-bench:latest
            ghcr.io/faunkr/strata-code-bench:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=code-bench
  ci-ok:
    # The one check that sums up a run, for branch protection: jobs a pull
    # request doesn't need are skipped, and skipped counts as passed.
    if: always()
    needs: [changes, test, windows, image, ui]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
