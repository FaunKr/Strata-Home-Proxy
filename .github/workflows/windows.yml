name: Windows
# The PC service on real Windows, started by hand (Actions → Windows → Run
# workflow). CI lints its Windows code on Linux instead; this also runs the
# tests that only exist on Windows. Not part of ci-ok.
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p strata-pc-agent --all-targets -- -D warnings
      - run: cargo test -p strata-pc-agent
      - name: The PowerShell scripts parse under Windows PowerShell 5.1
        run: |
          $failed = $false
          foreach ($file in 'deploy\windows\install.ps1', 'tools\local-agent\local-agent.ps1', 'tools\local-agent\install.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD\$file", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $file; $errors; $failed = $true }
          }
          if ($failed) { exit 1 }
        shell: powershell
