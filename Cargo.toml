[workspace]
resolver = "3"
members = ["crates/admin-ui", "crates/nas-proxy", "crates/pc-agent", "crates/pc-protocol"]

[workspace.package]
# The product version: the web UI shows it, a release publishes it
# (CHANGELOG.md, docs/ci.md). The PC service keeps its own in its Cargo.toml,
# since it decides PC updates (docs/pc-service.md).
version = "1.1.0"
license = "MIT"

# Line tables keep backtraces with file and line; full debug info and the
# incremental cache grew target/ to 30 GB and filled the disk.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
lto = "thin"
strip = true

# Builds the web UI with cargo-leptos: the server part is linked into the NAS
# proxy, the browser part is compiled to WebAssembly under site/admin/pkg.
[[workspace.metadata.leptos]]
name = "admin-ui"
output-name = "admin-ui"
bin-package = "strata-nas-proxy"
lib-package = "strata-admin-ui"
lib-features = ["hydrate"]
site-root = "target/site"
site-pkg-dir = "admin/pkg"
style-file = "crates/admin-ui/style/main.css"
lib-profile-release = "wasm-release"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
