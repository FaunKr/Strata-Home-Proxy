[package]
name = "strata-nas-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
axum = "0.8.9"
bytes = "1.12.1"
futures-util = "0.3.34"
hmac = "0.12.1"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
strata-admin-ui = { path = "../admin-ui", features = ["ssr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

