[package]
name = "strata-pc-agent"
version = "0.2.0"
edition = "2024"
license.workspace = true
# One test binary for all files in tests/ (tests/main.rs lists them): each
# binary links the whole crate, so one per file cost a link and hundreds of MB each.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
strata-pc-protocol = { path = "../pc-protocol" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
getrandom = "0.3.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
bytes = "1.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Performance", "Wdk_Graphics_Direct3D", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Registry", "Win32_System_Ioctl", "Win32_System_IO"] }
