# PC service config. Put it next to strata-pc-agent.exe as
# strata-pc-agent.toml and adjust it.

# Address and port of the service. The proxy points here with PC_AGENT_URL.
listen = "0.0.0.0:8091"

# Secret shared with the NAS (PC_AGENT_TOKEN there). Long and random,
# e.g. in PowerShell: -join ((48..57)+(97..122) | Get-Random -Count 40 | % {[char]$_})
token = "put-a-long-random-secret-here"

# Only the NAS may call the service (the desktop shortcut through 127.0.0.1 is
# always allowed). Left empty, anyone with the token may.
allowed_clients = ["192.168.1.10"]

# Strata on this PC.
strata_url = "http://127.0.0.1:8080"
# Strata's API key, if /health or /slots ask for it.
#strata_api_key = "..."

# What starts Strata, and with which arguments.
strata_start = 'C:\Strata\START-HERE.bat'
strata_args = []

# What belongs to a running Strata; stopped in gaming mode. A folder (with \
# at the end) stops every program from it along with everything it started:
# Strata runs as Python from .venv, which starts engine\strata.exe and
# restarts it after a crash. A program name (e.g. "strata.exe") stops only
# programs with exactly that name.
strata_processes = ['C:\Strata\']

# No sleep while the last keyboard or mouse input is more recent than this.
user_idle_minutes = 10

# Start Strata when it is not running and gaming mode is off.
auto_start = true

# Stop Strata before standby and start it again after waking. The wake-up
# then takes 1-3 min instead of about 12 s, but the graphics card starts
# clean. Needed on this PC: with the RX 6800 XT the first request after
# standby hangs otherwise (tested on 2026-10-18).
fresh_strata_after_standby = true

# If Strata does not answer /health for this long, it is restarted.
restart_after_secs = 60

# After a start, wait this long for the model to load.
load_time_secs = 240

# After a context change the active model must answer within this time,
# otherwise its old context comes back.
context_start_secs = 600

# Pause between stopping Strata and the next start, so the stopped one frees
# its port.
stop_settle_ms = 2000

# MAC address reported to the NAS. Usually left empty: the service then
# reports that of the network card through which the NAS reaches it.
#mac = "AA-BB-CC-DD-EE-FF"
