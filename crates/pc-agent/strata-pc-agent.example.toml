# Konfiguration des PC-Dienstes. Als strata-pc-agent.toml neben
# strata-pc-agent.exe ablegen und anpassen.

# Adresse und Port des Dienstes. Der NAS-Proxy zeigt mit PC_AGENT_URL hierhin.
listen = "0.0.0.0:8091"

# Gemeinsames Geheimnis mit dem NAS (dort PC_AGENT_TOKEN). Lang und zufällig,
# z. B. in PowerShell: -join ((48..57)+(97..122) | Get-Random -Count 40 | % {[char]$_})
token = "hier-ein-langes-zufaelliges-geheimnis"

# Nur das NAS darf den Dienst aufrufen (die Desktop-Verknüpfung über 127.0.0.1
# ist immer erlaubt). Leer lassen erlaubt jeden mit Token.
allowed_clients = ["192.168.1.10"]

# Strata auf diesem PC.
strata_url = "http://127.0.0.1:8080"
# API-Key von Strata, falls /health oder /slots ihn verlangen.
#strata_api_key = "..."

# Womit Strata gestartet wird, und mit welchen Argumenten.
strata_start = 'C:\Strata\START-HERE.bat'
strata_args = []

# Was zu einem laufenden Strata gehört; wird im Gaming-Modus beendet. Ein
# Ordner (mit \ am Ende) beendet jedes Programm daraus samt allem, was es
# gestartet hat: Strata läuft als Python aus .venv, das engine\strata.exe
# startet und nach einem Absturz neu startet. Ein Programmname (z. B.
# "strata.exe") beendet nur Programme mit genau diesem Namen.
strata_processes = ['C:\Strata\']

# Kein Schlafen, solange die letzte Tastatur- oder Mauseingabe jünger ist.
user_idle_minutes = 10

# Strata selbst starten, wenn es nicht läuft und der Gaming-Modus aus ist.
auto_start = true

# Strata vor dem Standby beenden und nach dem Aufwachen neu starten. Das
# Aufwachen dauert dann 1-3 min statt ca. 12 s, dafür startet die Grafikkarte
# sauber. Auf diesem PC nötig: mit der RX 6800 XT hängt sonst die erste
# Anfrage nach dem Standby (getestet am 18.10.2026).
fresh_strata_after_standby = true

# Antwortet Strata so lange nicht auf /health, wird es neu gestartet.
restart_after_secs = 60

# Nach einem Start so lange warten, bis das Modell geladen ist.
load_time_secs = 240

# Nach einem Kontextwechsel muss das aktive Modell so schnell antworten, sonst
# kommt sein alter Kontext zurück.
context_start_secs = 600

# Pause zwischen dem Beenden von Strata und dem nächsten Start, damit das
# beendete seinen Port freigibt.
stop_settle_ms = 2000

# MAC-Adresse, die dem NAS gemeldet wird. Normalerweise leer lassen: der Dienst
# meldet dann die der Netzwerkkarte, über die das NAS ihn erreicht.
#mac = "AA-BB-CC-DD-EE-FF"
