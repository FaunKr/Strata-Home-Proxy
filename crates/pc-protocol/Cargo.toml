[package]
name = "strata-pc-protocol"
version.workspace = true
edition = "2024"
license.workspace = true

# The PC service's API as types: the PC service writes them, the proxy reads
# them, the web UI shows them. Only serde, so it builds for wasm too.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
