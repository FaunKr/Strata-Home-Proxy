# Auf dem NAS: Werte in .env eintragen (Vorlage: env.example), dann
#   docker compose pull && docker compose up -d
services:
  strata-proxy:
    image: ghcr.io/faunkr/strata-home-proxy:latest
    # Alternativ selbst bauen statt laden: die Zeile oben durch "build: .." ersetzen.
    container_name: strata-proxy
    restart: unless-stopped
    # Host-Netz ist nötig: das Weckpaket ist ein Broadcast und kommt aus
    # einem Bridge-Netz nicht ins Heimnetz.
    network_mode: host
    env_file: .env
    environment:
      CODE_BENCH_URL: http://127.0.0.1:8096
    volumes:
      - ./data:/data
  # Der Code-Benchmark (tools/code-bench): opencode löst darin Aufgaben gegen
  # den Proxy. Ohne diesen Dienst fehlt nur der Code-Benchmark.
  code-bench:
    image: ghcr.io/faunkr/strata-code-bench:latest
    container_name: strata-code-bench
    restart: unless-stopped
    # Nur der Proxy auf dem NAS erreicht den Runner.
    ports:
      - 127.0.0.1:8096:8096
    # Der Proxy läuft im Host-Netz; so erreicht opencode ihn.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      PROXY_URL: http://host.docker.internal:8080
    # Der Agent führt hier Befehle aus: Grenzen gegen Ausreißer.
    mem_limit: 4g
    pids_limit: 512
