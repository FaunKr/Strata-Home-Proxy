# TrueNAS SCALE: Apps → Discover Apps → ⋮ → Install via YAML.
# Once beforehand via SSH: sudo docker login ghcr.io -u FaunKr (token as password)
# and sudo docker pull ghcr.io/faunkr/strata-home-proxy:latest
# Then set up everything else under http://<NAS-IP>:8080/admin/ (log in
# with "admin" or UI_PASSWORD). Values there take precedence over the values here.
services:
  strata-proxy:
    image: ghcr.io/faunkr/strata-home-proxy:latest
    # missing: only then can deploy/truenas-auto-update.sh roll back to the old image.
    pull_policy: missing
    restart: unless-stopped
    # Needed so that the wake packet (a broadcast) reaches the home network.
    network_mode: host
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      STRATA_URL: http://192.168.1.50:8080
      # Only for the first start; after that the PC service reports its MAC itself.
      PC_MAC: AA-BB-CC-DD-EE-FF
      WOL_ADDR: 192.168.1.255:9
      # From step 3, once the PC service runs:
      # PC_AGENT_URL: http://192.168.1.50:8091
      # PC_AGENT_TOKEN: the-same-secret-as-in-strata-pc-agent.toml
      # For times of day on the Overview and keep awake "Until 8:00".
      TZ: Europe/Berlin
      # The code benchmark in the code-bench service below.
      CODE_BENCH_URL: http://127.0.0.1:8096
      # Apps see one model name instead of the model Strata runs (also in the web UI).
      # HIDE_MODEL: "true"
      # PUBLIC_MODEL_NAME: strata
      IDLE_TIMEOUT_SECS: "900"
      WAKE_TIMEOUT_SECS: "240"
      # Initial password of the web UI (otherwise "admin"); change it at the first login.
      # UI_PASSWORD: ...
    # Settings, password and the remembered MAC live here.
    volumes:
      - /mnt/POOL/apps/strata-proxy:/data
  # The code benchmark (tools/code-bench): in it opencode solves tasks against
  # the proxy. Without this service only the code benchmark is missing.
  code-bench:
    image: ghcr.io/faunkr/strata-code-bench:latest
    restart: unless-stopped
    # Only the proxy on the NAS reaches the runner.
    ports:
      - 127.0.0.1:8096:8096
    # The proxy runs in the host network; this is how opencode reaches it.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Port as in LISTEN_ADDR above.

      PROXY_URL: http://host.docker.internal:8080
    # So that the runner can block the NAS, the home network and its own API for
    # the coding agent; without it, it refuses runs.
    cap_add:
      - NET_ADMIN
    # The coding agent runs commands here: limits against runaways.

    mem_limit: 4g
    pids_limit: 512
